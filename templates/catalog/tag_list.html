{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block title %}
  <title>Tags</title>
{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Tags</h1>
    <a href="{% url "catalog:tag-create" %}" class="btn btn-primary btn-lg">Create</a>
  </div>

  <table class="table">
    <tr>
      <th>Name</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>
    {% for tag in tag_list %}
      <tr>
        <td>{{ tag.name }}</td>
        <td>
          <a href="{% url "catalog:tag-update" tag.id %}" class="btn btn-secondary">Update</a>
        </td>
        <td>
          <a href="{% url "catalog:tag-delete" tag.id %}" class="btn btn-secondary">Delete</a>
        </td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="3">No tags found.</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
