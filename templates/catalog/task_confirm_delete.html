{% extends "base.html" %}

{% block content %}
  <h1>Delete task: "{{ task.content }}"?</h1>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{% url "catalog:task-list" %}" class="btn btn-primary">Cancel</a>
  </form>
{% endblock %}
